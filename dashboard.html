<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYNZU BOT Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d1117;
color:white;
padding:20px;
}

.card{
background:#161b22;
border-radius:15px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
text-align:center;
color:#58a6ff;
margin-bottom:20px;
}

.status{
text-align:center;
font-size:20px;
font-weight:bold;
color:#3fb950;
margin-top:10px;
}

input,textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#21262d;
color:white;
}

button{
width:100%;
padding:13px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.green{
background:#238636;
color:white;
}

.blue{
background:#1f6feb;
color:white;
}

.red{
background:#da3633;
color:white;
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

.box{
background:#21262d;
padding:15px;
border-radius:10px;
text-align:center;
}

footer{
text-align:center;
margin-top:30px;
color:#8b949e;
}
</style>

</head>
<body>

<h1>🤖 SYNZU BOT PANEL</h1>

<div class="card">

<div class="status">
🟢 BOT ONLINE
</div>

</div>

<div class="card">

<h2>Bot Settings</h2>

<label>Prefix</label>
<input value="!">

<label>GC Name Lock</label>
<input value="ANG ATING GC">

<label>Default Nickname</label>
<input value="Member">

<label>Auto Reply JSON</label>

<textarea rows="8">
{
 "hi":"Hello!",
 "bot":"Present!",
 "owner":"Synzu"
}
</textarea>

<button class="green">
💾 Save Settings
</button>

</div>

<div class="card">

<h2>Quick Actions</h2>

<button class="blue">
❤️ Auto React : ON
</button>

<button class="blue">
🔒 Lock GC Name : ON
</button>

<button class="blue">
🤖 Auto Reply : ON
</button>

<button class="blue">
👥 Set All Nickname
</button>

<button class="red">
🔄 Restart Bot
</button>

</div>

<div class="card">

<h2>Statistics</h2>

<div class="info">

<div class="box">
<h3>Commands</h3>
<h2>4</h2>
</div>

<div class="box">
<h3>Admins</h3>
<h2>1</h2>
</div>

<div class="box">
<h3>Status</h3>
<h2>ONLINE</h2>
</div>

<div class="box">
<h3>Version</h3>
<h2>v2.0</h2>
</div>

</div>

</div>

<footer>
Developed by <b>Synzu</b>
</footer>

</body>
  </html>
